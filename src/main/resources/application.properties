spring.application.name=bank-transfer-app

# ---- MySQL connection (XAMPP defaults: user root, empty password) ----
# createDatabaseIfNotExist=true creates the database "bank_db" automatically
spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# My MySQL has a password, so it is read from secrets.properties (ignored by Git)
spring.config.import=optional:file:./secrets.properties

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# I use MariaDB (MySQL-compatible) instead of XAMPP's MySQL: tell Hibernate the SQL dialect directly
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Show transaction begin / commit / rollback in the console (great for this lab) ----
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
